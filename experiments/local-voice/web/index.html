</style></head><body><main><span class="tag">● 离线识别 · 录音不上传</span><h1>ZUK 语音中控实验</h1><p class="sub">本机麦克风 → 离线中文识别 → HA 指令预览。当前不会控制家电。</p><div class="card"><div class="label">本地服务</div><div id="status">连接中…</div></div><button id="record" disabled>加载中…</button><p id="hint" class="note">点击开始说话，再点击结束。首次使用请允许 Chrome 访问麦克风。</p><div class="card"><div class="label">识别文本</div><div class="main" id="transcript">—</div><div class="label">匹配结果（只预览，不执行）</div><div id="action">—</div><p id="latency" class="note"></p></div><div class="card"><div class="label">可以尝试</div><div class="example">“打开客厅灯”　“关闭客厅灯”<br>“打开窗帘”　“关闭空调”</div></div><p class="note">隐私说明：只连接 127.0.0.1:8126，最长录音 8 秒，不常驻录音，不调用外部语音服务。本实验不会调用 HA 设备控制接口。</p><script src="/app.js"></script></main></body></html>
